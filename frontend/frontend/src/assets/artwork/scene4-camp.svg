<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="1"/>
      <stop offset="30%" stop-color="#fb8500" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#d90429" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#12162d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Campfire Radial Light Glow -->
  <circle cx="960" cy="850" r="350" fill="url(#fireGlow)"/>

  <!-- Tents Silhouette Left & Right -->
  <!-- Left Tent -->
  <polygon points="420,860 560,700 700,860" fill="#090b14"/>
  <polygon points="450,860 560,700 560,860" fill="#14182b"/>
  
  <!-- Right Tent -->
  <polygon points="1220,870 1340,730 1460,870" fill="#090b14"/>

  <!-- Campfire Log Structure & Flames -->
  <g transform="translate(960, 850)">
    <!-- Logs -->
    <rect x="-40" y="20" width="80" height="12" rx="4" fill="#3d1e03" transform="rotate(-15)"/>
    <rect x="-40" y="20" width="80" height="12" rx="4" fill="#2b1502" transform="rotate(15)"/>
    <!-- Flames -->
    <path d="M-20,15 Q-10,-40 0,-70 Q20,-30 20,15 Q10,-10 0,0 Q-10,-10 -20,15 Z" fill="#ffb703"/>
    <path d="M-10,15 Q-5,-25 0,-45 Q10,-20 10,15 Q5,-5 0,0 Q-5,-5 -10,15 Z" fill="#fff3b0"/>
  </g>

  <!-- Friends Sitting Around Campfire Silhouettes -->
  <g fill="#090b14">
    <!-- Person sitting left -->
    <circle cx="860" cy="815" r="12"/>
    <path d="M840,860 Q860,830 875,860 Z"/>
    
    <!-- Person sitting right -->
    <circle cx="1060" cy="815" r="12"/>
    <path d="M1045,860 Q1060,830 1080,860 Z"/>
  </g>
</svg>
