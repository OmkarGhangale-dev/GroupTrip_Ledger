<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#0d1329"/>
      <stop offset="75%" stop-color="#191d3a"/>
      <stop offset="100%" stop-color="#2a2550"/>
    </linearGradient>
    <radialGradient id="nebula" cx="60%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#nightSkyGrad)"/>
  <rect width="1920" height="1080" fill="url(#nebula)"/>

  <!-- Crescent Moon -->
  <path d="M1450,150 A60,60 0 1,0 1520,230 A75,75 0 1,1 1450,150 Z" fill="#fef08a" opacity="0.9"/>

  <!-- Twinkling Star Field -->
  <g fill="#ffffff">
    <circle cx="200" cy="120" r="2" opacity="0.9"/>
    <circle cx="350" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="500" cy="220" r="2.5" opacity="0.8"/>
    <circle cx="680" cy="150" r="1" opacity="0.6"/>
    <circle cx="850" cy="90" r="2" opacity="0.95"/>
    <circle cx="1020" cy="180" r="1.5" opacity="0.75"/>
    <circle cx="1200" cy="110" r="3" opacity="0.85"/>
    <circle cx="1320" cy="240" r="1.5" opacity="0.7"/>
    <circle cx="1650" cy="100" r="2" opacity="0.9"/>
    <circle cx="1780" cy="200" r="1" opacity="0.65"/>
    <circle cx="150" cy="300" r="1.5" opacity="0.8"/>
    <circle cx="420" cy="350" r="2" opacity="0.7"/>
    <circle cx="900" cy="320" r="2.5" opacity="0.9"/>
    <circle cx="1150" cy="290" r="1" opacity="0.6"/>
    <circle cx="1580" cy="310" r="2" opacity="0.85"/>
  </g>
</svg>
