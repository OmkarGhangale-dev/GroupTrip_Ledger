<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31427d"/>
      <stop offset="40%" stop-color="#1e2752"/>
      <stop offset="100%" stop-color="#0f132e"/>
    </linearGradient>

    <linearGradient id="sunsetReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b54" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff9a56" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff7b54" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Lake Water Body -->
  <path d="M-50,750 Q450,700 960,730 Q1470,760 1970,710 L1970,1080 L-50,1080 Z" fill="url(#lakeWater)"/>

  <!-- Sunset Glow Reflection on Lake -->
  <ellipse cx="960" cy="840" rx="550" ry="18" fill="url(#sunsetReflection)"/>
  <ellipse cx="820" cy="890" rx="350" ry="12" fill="url(#sunsetReflection)"/>

  <!-- Water Rocks in Lake -->
  <ellipse cx="420" cy="890" rx="45" ry="22" fill="#151b3d"/>
  <ellipse cx="510" cy="910" rx="30" ry="15" fill="#0d1128"/>
  <ellipse cx="340" cy="920" rx="25" ry="12" fill="#182046"/>
</svg>
