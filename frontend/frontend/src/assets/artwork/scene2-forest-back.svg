<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightCliff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18132b"/>
      <stop offset="60%" stop-color="#0d0a1b"/>
      <stop offset="100%" stop-color="#06040d"/>
    </linearGradient>

    <linearGradient id="waterfallGlowStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#e0e7ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a5b4fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="sprayLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#a5b4fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#18132b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cliff Rocks & Cave Framing -->
  <path d="M-50,0 L700,0 L620,400 L750,700 L450,1080 L-50,1080 Z" fill="url(#nightCliff)"/>
  <path d="M1970,0 L1250,0 L1320,300 L1180,650 L1450,1080 L1970,1080 Z" fill="url(#nightCliff)"/>

  <!-- Cascading Waterfall Streams on Right (matching reference 2) -->
  <polygon points="1680,0 1780,0 1820,550 1620,550" fill="url(#waterfallGlowStream)"/>
  <polygon points="1600,520 1850,520 1890,1080 1520,1080" fill="url(#waterfallGlowStream)"/>
  
  <polygon points="1350,380 1480,380 1520,720 1310,720" fill="url(#waterfallGlowStream)" opacity="0.85"/>
  <polygon points="1280,700 1560,700 1620,1080 L1220,1080" fill="url(#waterfallGlowStream)" opacity="0.85"/>

  <!-- Spray Mist ambient glow -->
  <circle cx="1700" cy="540" r="160" fill="url(#sprayLight)"/>
  <circle cx="1450" cy="720" r="140" fill="url(#sprayLight)"/>
</svg>
