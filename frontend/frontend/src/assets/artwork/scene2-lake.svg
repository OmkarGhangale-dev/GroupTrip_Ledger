<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="poolWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="bioglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Water Surface -->
  <path d="M-50,720 Q450,650 960,680 Q1470,710 1970,660 L1970,1080 L-50,1080 Z" fill="url(#poolWater)"/>

  <!-- Bioluminescent Pool Glow -->
  <ellipse cx="1200" cy="850" rx="450" ry="80" fill="url(#bioglow)"/>
  <ellipse cx="600" cy="880" rx="350" ry="60" fill="url(#bioglow)"/>

  <!-- Mossy Rock Formations (matching reference photo 2) -->
  <path d="M350,780 Q550,720 750,790 Q950,860 1150,770 L1150,1080 L350,1080 Z" fill="#0d0e1e"/>
  <ellipse cx="550" cy="760" rx="140" ry="50" fill="#151733"/>
  <ellipse cx="950" cy="780" rx="160" ry="55" fill="#111329"/>
</svg>
