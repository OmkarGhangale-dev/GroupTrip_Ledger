<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="reedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca56a"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#3b1500"/>
    </linearGradient>

    <linearGradient id="foreGroundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141936"/>
      <stop offset="100%" stop-color="#070917"/>
    </linearGradient>
  </defs>

  <!-- Ground Ledge -->
  <path d="M-50,910 Q500,840 1000,900 Q1500,960 1970,870 L1970,1080 L-50,1080 Z" fill="url(#foreGroundGrad)"/>

  <!-- Tall Golden Grass & Reeds (Foreground center and right matching reference 1) -->
  <g stroke="url(#reedGrad)" stroke-linecap="round">
    <path d="M720,950 Q710,800 735,710 M740,950 Q755,780 770,690 M765,960 Q750,810 790,730" stroke-width="6"/>
    <path d="M810,950 Q795,770 830,680 M840,960 Q860,790 875,700 M870,960 Q850,820 895,735" stroke-width="5"/>
    <path d="M910,960 Q900,800 935,715 M940,960 Q960,810 970,725 M975,960 Q955,830 995,745" stroke-width="6"/>

    <path d="M1420,950 Q1400,780 1445,690 M1450,960 Q1470,800 1485,710 M1480,960 Q1460,820 1515,730" stroke-width="6"/>
    <path d="M1540,950 Q1525,770 1560,680 M1570,960 Q1590,790 1605,700 M1600,960 Q1580,820 1625,735" stroke-width="5"/>
  </g>

  <!-- Traveler Character with Conical Kasa Hat, Backpack, and Flowing Red Robe/Scarf (matching reference 1) -->
  <g transform="translate(1380, 520) scale(1.6)">
    <!-- Conical Hat (Kasa) -->
    <polygon points="50,10 10,40 90,40" fill="#f59e0b"/>
    <polygon points="50,10 10,40 50,38" fill="#d97706"/>

    <!-- Head & Scarf -->
    <circle cx="50" cy="45" r="14" fill="#78350f"/>
    <path d="M35,50 Q50,60 85,45 Q75,70 95,95 Q80,105 60,80 Z" fill="#dc2626"/> <!-- Flowing Red Scarf -->

    <!-- Backpack / Travel Pack -->
    <rect x="25" y="55" width="24" height="42" rx="6" fill="#92400e"/>
    <rect x="28" y="50" width="18" height="12" rx="3" fill="#fef08a"/> <!-- Bedroll atop pack -->

    <!-- Body / Tunic -->
    <path d="M42,55 L68,55 L75,130 L38,130 Z" fill="#78350f"/>
    <path d="M42,55 L58,55 L60,130 L38,130 Z" fill="#451a03"/>

    <!-- Red Robe Skirt/Sash -->
    <path d="M48,90 Q70,95 90,120 L65,135 L40,125 Z" fill="#b91c1c"/>

    <!-- Legs & Gaiters -->
    <rect x="44" y="130" width="10" height="35" fill="#f59e0b"/>
    <rect x="58" y="130" width="10" height="35" fill="#d97706"/>
    <!-- Sandals -->
    <ellipse cx="49" cy="167" rx="8" ry="4" fill="#451a03"/>
    <ellipse cx="63" cy="167" rx="8" ry="4" fill="#451a03"/>
  </g>
</svg>
