<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomaii - GroupTrip Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f4f4f5",
              "surface-container": "#f4f4f5",
              "surface-container-high": "#e4e4e7",
              "surface-container-highest": "#d4d4d8",
              "background": "#fafafa",
              "surface": "#ffffff",
              "surface-dim": "#f4f4f5",
              "surface-bright": "#ffffff",
              "on-surface": "#000000",
              "on-surface-variant": "#555555",
              "on-background": "#000000",
              "primary": "#000000",
              "on-primary": "#ffffff",
              "primary-container": "#f4f4f5",
              "on-primary-container": "#000000",
              "secondary": "#000000",
              "secondary-container": "#f4f4f5",
              "on-secondary-container": "#000000",
              "tertiary": "#000000",
              "tertiary-container": "#f4f4f5",
              "on-tertiary-container": "#000000",
              "outline": "#e4e4e7",
              "outline-variant": "#d4d4d8",
              "error": "#e11d48",
              "error-container": "#ffe4e6",
              "on-error-container": "#9f1239"
            },
            fontFamily: {
              "display-hero": ["Noto Serif", "serif"],
              "display-hero-mobile": ["Noto Serif", "serif"],
              "headline-xl": ["Noto Serif", "serif"],
              "headline-lg": ["Noto Serif", "serif"],
              "headline-sm": ["Noto Serif", "serif"],
              "body-lg": ["Plus Jakarta Sans", "sans-serif"],
              "body-md": ["Plus Jakarta Sans", "sans-serif"],
              "body-sm": ["Plus Jakarta Sans", "sans-serif"],
              "label-md": ["Plus Jakarta Sans", "sans-serif"],
              "label-sm": ["Plus Jakarta Sans", "sans-serif"]
            },
            animation: {
              "fade-in": "fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards",
              "slide-up": "slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards"
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" }
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(12px)" },
                "100%": { opacity: "1", transform: "translateY(0)" }
              }
            }
          }
        }
      };
    </script>
    <style>
      /* View transition smoothness */
      .page-transition {
        animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.3s;
      }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
